bundle:
  name: recaller_list

include:
  - resources/*.yml

variables:
  environment:
    description: Catalog to read from and write to
    default: cosdpprd
  output_table:
    description: schema.table the notebook writes
    default: glall_user.recallerlist

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-747046091317089.9.azuredatabricks.net
    variables:
      # cosdpdev is not reachable from this workspace, so dev uses the prod catalog
      environment: cosdpprd
      output_table: glall_user.recallerlist